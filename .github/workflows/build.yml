name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: unzip DeathAnimation.zip
      - run: mvn -B clean package -f DeathAnimation/pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: DeathAnimation-jar
          path: DeathAnimation/target/*.jar
